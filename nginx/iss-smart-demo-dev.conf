server {
    listen 8080 default_server;  # Cloud Run requires port 8080
    listen [::]:8080 default_server;
    server_name _;

    client_max_body_size 10M;

    # Logging for debugging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Handle missing favicon gracefully
    location = /favicon.ico {
        try_files $uri /vite.svg =204;
        log_not_found off;
        access_log off;
    }

    location / {
        add_header Access-Control-Allow-Origin *;
        try_files $uri $uri/ /index.html;
    }

    # Serve static assets with proper caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/html text/css application/json application/x-javascript
        text/xml application/xml application/xml+rss text/javascript
        application/javascript text/x-js image/gif image/jpeg application/atom+xml
        application/rss+xml text/x-component image/png image/tiff image/vnd.wap.wbmp
        image/x-icon image/x-jng image/x-ms-bmp image/svg+xml image/webp
        application/font-woff application/msword application/pdf;
    gzip_buffers 16 8k;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";
}